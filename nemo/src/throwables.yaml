description: |
  Tunes the armory throwables' counts, explosion damage, and radii.

  Overall better ammo economy for low-end grenades.

throwables:
  ###########################
  # High-explosive grenades #
  ###########################

  G-12 High Explosive:
    notes: Nukes short radius.
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    throwable.explosion_delay: 4                          # stock 3.5
    explosion.inner_radius: 2.5                           # stock 2.5
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 1200                # stock 800
    explosion.damage.durable_damage: 1200                 # stock 800

  G-16 Impact:
    notes: Nukes short radius but on impact.
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    explosion.inner_radius: 2.5                           # stock 2.5
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 1200                # stock 400
    explosion.damage.durable_damage: 1200                 # stock 400

  G-50 Seeker:
    notes: Nukes short radius but self-propelled, lower count.
    throwable.max_count: 5                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    explosion.inner_radius: 2.5                           # stock 3.5
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 1200                # stock 500
    explosion.damage.durable_damage: 1200                 # stock 500

  #################
  # Frag grenades #
  #################

  G-6 Frag:
    notes: |
      Many shrapnel pellets.
      Big theoretical damage, but unreliable.
    # Pellets: each of the 35 shrapnel pellets is a direct hit (damage.* layer).
    # Shared with G/SH-39 Shield, TM-1 Lure Mine + 8 others.
    damage.standard_damage: 180                           # stock 110
    damage.durable_damage: 70                             # stock 35
    throwable.max_count: 6                                # stock 6
    throwable.count_from_supply: 4                        # stock 4
    explosion.inner_radius: 4                             # stock 4
    explosion.outer_radius: 10                            # stock 10
    explosion.shrapnel_count: 64                          # stock 35
    explosion.damage.standard_damage: 300                 # stock 500
    explosion.damage.durable_damage: 300                  # stock 500

  G-7 Pineapple:
    notes: Large area cleanup cluster grenade.
    throwable.max_count: 5                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    throwable.explosion_delay: 2.2                        # stock 2.4
    # Bomblet count: submunitions the blast spawns per detonation (stock 18).
    # Each bomblet deals no direct damage; its damage is its own sub-explosion
    # (the :bomblet_explosion fields below). Unique to G-7, still a shared
    # settings row.
    explosion.shrapnel_count: 24                          # stock 18
    explosions:
      G-7 Pineapple (detonation, shrapnel expiry):
        # Bomblet sub-explosion: each bomblet's own blast (:bomblet_explosion layer).
        explosion.inner_radius: 3                         # stock 2.5
        explosion.outer_radius: 6                         # stock 5
        explosion.damage.standard_damage: 400             # stock 100
        explosion.damage.durable_damage: 150              # stock 100
      G-7 Pineapple (detonation):
        # Blast: the central explosion on detonation (:explosion layer).
        explosion.damage.standard_damage: 200             # stock 300
        explosion.damage.durable_damage: 200              # stock 300

  ######################
  # Anti-tank grenades #
  ######################

  G-123 Thermite:
    notes: Destroys single target.
    throwable.max_count: 4                                # stock 3
    throwable.count_from_supply: 2                        # stock 2
    explosion.inner_radius: 1.5                           # stock 1.5
    explosion.outer_radius: 2.5                           # stock 2.5
    explosion.damage.standard_damage: 2000                # stock 2000
    explosion.damage.durable_damage: 2000                 # stock 2000

  G-60 Anti-Tank Seeker:
    notes: Destroys single target but self propelled.
    throwable.max_count: 4                                # stock 3
    throwable.count_from_supply: 2                        # stock 2
    explosion.inner_radius: 2                             # stock 4
    explosion.outer_radius: 3                             # stock 12
    explosion.damage.standard_damage: 3000                # stock 1800
    explosion.damage.durable_damage: 3000                 # stock 1800

  G-48 Giga Grenade:
    notes: Nukes large area, low count.
    throwable.max_count: 3                                # stock 2
    throwable.count_from_supply: 2                        # stock 2
    explosion.inner_radius: 4                             # stock 2
    explosion.outer_radius: 12                            # stock 12
    explosion.damage.standard_damage: 2400                # stock 2000
    explosion.damage.durable_damage: 2400                 # stock 2000

  #################
  # Fire grenades #
  #################

  G-10 Incendiary:
    notes: Medium area denial with explosion.
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    throwable.explosion_delay: 2                          # stock 2.9
    explosion.inner_radius: 1                             # stock 1
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 300                 # stock 300
    explosion.damage.durable_damage: 300                  # stock 300
    status.strength: 100                                  # stock 50

  G-13 Incendiary Impact:
    notes: Medium area denial with explosion but on impact.
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    explosion.inner_radius: 1                             # stock 1
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 300                 # stock 150
    explosion.damage.durable_damage: 300                  # stock 150
    status.strength: 100                                  # stock 100

  G-8 Immolation:
    notes: Large area denial without explosion.
    throwable.max_count: 6                                # stock 6
    throwable.count_from_supply: 3                        # stock 3
    explosion.inner_radius: 4                             # stock 4
    explosion.outer_radius: 12                            # stock 10
    explosion.damage.standard_damage: 20                  # stock 20
    explosion.damage.durable_damage: 20                   # stock 20
    status.strength: 100                                  # stock 100

  G-142 Pyrotech:
    notes: Small area denial, anti tank.
    throwable.max_count: 6                                # stock 6
    throwable.count_from_supply: 3                        # stock 3
    throwable.explosion_delay: 2.4                        # stock 2.9
    explosion.inner_radius: 2.5                           # stock 2.5
    explosion.outer_radius: 6                             # stock 5
    explosion.damage.standard_damage: 50                  # stock 50
    explosion.damage.durable_damage: 50                   # stock 50

  #################
  # Stun grenades #
  #################

  G-23 Stun:
    notes: |
      Large area.
      Stuns even big enemies.
    throwable.max_count: 7                                # stock 5
    throwable.count_from_supply: 4                        # stock 3
    throwable.starting_count: 5                           # stock 4
    throwable.explosion_delay: 1.4                        # stock 1.8
    explosion.inner_radius: 1                             # stock 1
    explosion.outer_radius: 12                            # stock 10
    explosion.damage.status_1_type: stun_massive          # stock stun_large

  G-109 Urchin:
    notes:
      Large area.
      Stuns even big enemies.
      Sticks to enemy/terrain.
    throwable.max_count: 7                                # stock 5
    throwable.count_from_supply: 4                        # stock 3
    throwable.starting_count: 5                           # stock 4
    throwable.explosion_delay: 3                          # stock 2.9
    explosion.inner_radius: 4                             # stock 2
    explosion.outer_radius: 12                            # stock 4
    explosion.damage.status_1_type: stun_massive          # stock stun_large

  ###############
  # Arc grenade #
  ###############

  G-31 Arc:
    notes: Area denial with more arks.
    damage.standard_damage: 150                           # stock 100
    damage.durable_damage: 100                            # stock 70
    arc.chain_count: 2                                    # stock 2
    arc.max_split: 3                                      # stock 2
    arc.max_angle_spread: 350                             # stock 180

  ##################
  # Smoke grenades #
  ##################

  G-3 Smoke:
    notes: Obscure large area.
    throwable.max_count: 7                                # stock 5
    throwable.count_from_supply: 4                        # stock 3
    throwable.starting_count: 6                           # stock 4
    throwable.explosion_delay: 2                          # stock 2.4
    explosion.inner_radius: 16                            # stock 8
    explosion.outer_radius: 16                            # stock 8

  G-89 Smokescreen:
    notes: Obscure large area but on impact.
    throwable.max_count: 7                                # stock 5
    throwable.count_from_supply: 4                        # stock 3
    throwable.starting_count: 6                           # stock 4
    explosion.inner_radius: 16                            # stock 5
    explosion.outer_radius: 16                            # stock 5

  #########
  # Mines #
  #########

  TM-1 Lure Mine:
    notes: Nukes large area.
    throwable.max_count: 4                                # stock 4
    throwable.count_from_supply: 3                        # stock 2
    explosion.inner_radius: 4                             # stock 2
    explosion.outer_radius: 12                            # stock 8
    explosion.damage.standard_damage: 1200                # stock 1000
    explosion.damage.durable_damage: 1200                 # stock 1000

  G/40-K Melta Mine:
    notes: Nukes medium area but anti-tank.
    throwable.max_count: 4                                # stock 4
    throwable.count_from_supply: 2                        # stock 2
    explosion.inner_radius: 2.5                           # stock 2.5
    explosion.outer_radius: 6                             # stock 6
    explosion.damage.standard_damage: 3000                # stock 2000
    explosion.damage.durable_damage: 3000                 # stock 2000

  ##################
  # Shield grenade #
  ##################

  G/SH-39 Shield:
    notes: Larger radius and health.
    throwable.max_count: 5                                # stock 4
    throwable.count_from_supply: 3                        # stock 2
    shield.radius: 2.2                                    # stock 1.8
    shield.durability: 2000                               # stock 1000
