throwables:
  ###########################
  # High-explosive grenades #
  ###########################

  G-12 High Explosive:
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
    throwable.explosion_delay: 4                          # stock 3.5
    explosion.inner_radius: 2.5                           # stock 2.5
    explosion.outer_radius: 7                             # stock 7
    explosion.damage.standard_damage: 1200                # stock 800
    explosion.damage.durable_damage: 1200                 # stock 800

  G-16 Impact:
    throwable.max_count: 6                                # stock 5
    throwable.count_from_supply: 3                        # stock 3
