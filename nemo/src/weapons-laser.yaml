description: |
  Tunes the laser weapons' damage, heat, and spread.

  Lasers: almost no durable damage, AP 2, infinite ammo, no recoil or spread.
  Fast shooting lasers apply fire: ~1 s of sustained fire ignites a
  target, the burn ticks 100/100 for 3 s. Light enemies die before
  ignition; medium ones need sustained fire and pay the burn.

weapons:

  ################
  # Hard hitting #
  ################

  LAS-99 Quasar Cannon:
    notes: |
      Laser anti-tank support weapon.
      Reduced charge up time.
    weapon.sway: 0.7                                      # stock 1
    heat.firing_charge: 66                                # stock 100
    heat.charge_gain_per_second: 66                       # stock 33
    heat.cool_per_second: 8.33                            # stock 6.66; post-shot cooldown 100/8.33 = 12.0 s (was 15.0 s)
    heat.cool_per_second_overheated: 8.33                 # stock 6.66; match the non-overheated rate

