description: Tunes the special weapons' damage, charge, and ergonomics.

weapons:

  JAR-5 Dominator:
    notes: Warhammer bolter.
    weapon.ergonomics: 40                                 # stock 30
    weapon.sway: 0.6                                      # stock 0.8
    weapon.fire_rate: 350                                 # stock 250
    reload.duration: 3.3                                  # stock 3.667
    fire_mode.modes.3: 1                                  # stock 0 -- full-auto mode
    # Fire the P/40-K Bolt Pistol round (projectile 202) instead of the default
    # rocket; the round's own damage, velocity and explosion apply.
    ammunition.projectile: 202

  ARC-3 Arc Thrower:
    notes: Bigger durable damage, more arcs.
    weapon.sway: 0.7                                      # stock 1
    weapon.horizontal_spread: 1                           # stock 10
    weapon.vertical_spread: 1                             # stock 10
    damage.primary.standard_damage: 250                   # stock 250
    damage.primary.durable_damage: 250                    # stock 100
    charge.level_1: 0.1                                   # stock 1; min charge time
    charge.level_2: 0.8                                   # stock 1.1; full charge time
    charge.level_3: 1                                     # stock 1.2; overcharge time
    charge.auto_fire_at_full: true                        # stock false; hold to keep firing
    arc.primary.chain_count: 2                            # stock 1
    arc.primary.max_split: 2                              # stock 1
    arc.primary.max_angle_spread: 90                      # stock 60
    arc.primary.range: 60                                 # stock 55
    arc.primary.distance_at_max_spread: 50                # stock 40

  P-35 Re-Educator:
    notes: Stuns even heavy enemies, more ammo.
    weapon.sway: 0.5                                      # stock 1
    weapon.fire_rate: 300                                 # stock 110
    damage.status_3_type: stun_massive                    # stock none
    damage.status_3_strength: 100                         # stock 0
    magazine.starting_magazines: 3                        # stock 2
    magazine.spare_magazines: 3                           # stock 2
    magazine.magazines_from_supply: 3                     # stock 2
