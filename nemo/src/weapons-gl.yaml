description: Tunes the grenade launchers' projectile damage and spread.

weapons:

  GL-21 Grenade Launcher:
    weapon.horizontal_spread: 15                          # stock 20
    weapon.vertical_spread: 15                            # stock 20

  GL-52 De-Escalator:
    weapon.sway: 0.7                                      # stock 1
    damage.primary_impact_arc.standard_damage: 150        # stock 100
    damage.primary_impact_arc.durable_damage: 100         # stock 70
    arc.primary_impact_arc.chain_count: 2                 # stock 2
    arc.primary_impact_arc.max_split: 3                   # stock 2
    arc.primary_impact_arc.max_angle_spread: 350          # stock 300

  GL-28 Belt-Fed Grenade Launcher:
    weapon.ergonomics: 45                                 # stock 20
    weapon.sway: 0.8                                      # stock 1
    weapon.horizontal_spread: 2                           # stock 4
    weapon.vertical_spread: 2                             # stock 4
    # Fire the P/40-K Bolt Pistol round (projectile 202) instead of the default
    # grenade; the round's own damage, velocity and explosion apply.
    attack.primary.projectile: 202
    backpacks:
      GL-28 Belt-Fed Grenade Launcher Backpack:
        deposit.capacity: 250
        deposit.start_amount: 250
        deposit.refill_amount: 120

  GL-15 Evictor:
    weapon.horizontal_spread: 5                           # stock 15
    weapon.vertical_spread: 10                            # stock 12
    explosion.primary.impact.damage.standard_damage: 440  # stock 440
    explosion.primary.impact.damage.durable_damage: 440   # stock 440
    explosion.primary.impact.inner_radius: 7.5            # stock 2.25
    explosion.primary.impact.outer_radius: 7.5            # stock 5.5

  GP-31 Grenade Pistol:
    weapon.horizontal_spread: 10                          # stock 30
    weapon.vertical_spread: 10                            # stock 30
    weapon.sway: 0.8                                      # stock 1
    weapon.recoil_climb_vertical: 50                      # stock 50
    projectile.drag: 1.2                                  # stock 1.2
    damage.standard_damage: 250                           # stock 250
    damage.durable_damage: 250                            # stock 250
    explosion.primary.impact.damage.standard_damage: 440  # stock 400
    explosion.primary.impact.damage.durable_damage: 440   # stock 400
    explosion.primary.impact.inner_radius: 7.5            # stock 2.25
    explosion.primary.impact.outer_radius: 7.5            # stock 6.5
    rounds.feed_capacity_1: 1                             # stock 1
    rounds.starting_rounds: 8                             # stock 4
    rounds.spare_rounds: 16                               # stock 6
    rounds.rounds_from_supply: 8                          # stock 4
