description: |
  Tunes the machine guns' spread, damage, and magazine reloads.

  MG-43, M-1000 and MG-206 get lower drag and much higher durable damage, rebalanced per weapon: MG-43 and M-1000
  around the DMR, MG-206 around the magnum caliber. M-105 and MG-43 get swapped scopes (4x and 10x).

weapons:

  M-105 Stalwart:
    notes: |
      Balanced around Liberator damage.
      Scope swapped to 4x.
    weapon.sway: 0.7                                      # stock 1
    weapon.horizontal_spread: 1.5                         # stock 6
    weapon.vertical_spread: 1.5                           # stock 6
    raw:
      - component: WeaponCustomizationComponentData
        resource: '0xA6A735ACCB4A327F'
        offset: '0x4'
        type: u32
        expect: 3885038159  # 0xE790FA4F
        value: 3905063732  # 0xE8C28B34 COMBAT SCOPE 4x

  MG-43 Machine Gun:
    notes: |
      Balanced around DMR damage.
      Scope swapped to 10x.
    weapon.horizontal_spread: 1.5                         # stock 4
    weapon.vertical_spread: 1.5                           # stock 4
    weapon.ergonomics: 25                                 # stock 15
    weapon.sway: 0.7                                      # stock 1
    weapon.recoil_drift_horizontal: 20                    # stock 20
    weapon.recoil_drift_vertical: 20                      # stock 20
    weapon.recoil_climb_horizontal: 15                    # stock 15
    weapon.recoil_climb_vertical: 30                      # stock 30
    reload.duration: 3                                    # stock 4.5
    projectile.primary.drag: 0.2                          # stock 0.3
    projectile.primary.penetration_slowdown: 0.2          # stock 0.25
    damage.primary.standard_damage: 150                   # stock 90
    damage.primary.durable_damage: 70                     # stock 23
    damage.primary.ap_large: 2                            # stock 3
    raw:
      - component: WeaponCustomizationComponentData
        resource: '0x11C27D3BABB38956'
        offset: '0x4'
        type: u32
        expect: 1713239419  # 0x661DF57B TUBE REDDOT 1.5x
        value: 1742775424  # 0x67E0A480 SNIPER SCOPE 10x

  M-1000 Maxigun:
    notes: Balanced around MG-43, same damage, but with backpack.
    weapon.ergonomics: 15                                 # stock 4
    weapon.sway: 1                                        # stock 1
    weapon.horizontal_spread: 1.5                         # stock 10
    weapon.vertical_spread: 1.5                           # stock 10
    weapon.stationary_while_firing: false                 # stock true
    weapon.recoil_drift_horizontal: 25                    # stock 20
    weapon.recoil_drift_vertical: 10                      # stock 20
    weapon.recoil_climb_horizontal: 20                    # stock 15
    weapon.recoil_climb_vertical: 15                      # stock 30
    windup.wind_up_seconds: 0.2                           # stock 0.5
    projectile.primary.drag: 0.2                          # stock 0.3
    projectile.primary.penetration_slowdown: 0.2          # stock 0.25
    damage.primary.standard_damage: 150                   # stock 80
    damage.primary.durable_damage: 75                     # stock 18
    damage.primary.ap_large: 2                            # stock 3

  MG-206 Heavy Machine Gun:
    notes: |
      Balanced around magnum caliber.
      Has better AP (penetrates even on light angles), but lower damage than DMR with lapua.
    weapon.ergonomics: 15                                 # stock 0
    weapon.sway: 1                                        # stock 1
    weapon.horizontal_spread: 1.5                         # stock 5
    weapon.vertical_spread: 1.5                           # stock 5
    weapon.capacity: 100                                  # stock 100
    reload.duration: 4                                    # stock 5.5
    projectile.primary.drag: 0.2                          # stock 0.3
    projectile.primary.penetration_slowdown: 0.2          # stock 0.25
    damage.primary.standard_damage: 220                   # stock 150
    damage.primary.durable_damage: 100                    # stock 35
    damage.primary.stagger: 30                            # stock 25
    damage.primary.ap_large: 3                            # stock 4
    magazine.magazines_from_supply: 4                     # stock 2
    magazine.spare_magazines: 3                           # stock 2
    magazine.starting_magazines: 2                        # stock 1

  E/MG-101 HMG Emplacement / weapon:
    notes: Reduced recoil.
    weapon.recoil_climb_vertical: 5
    weapon.recoil_drift_horizontal: 10
    weapon.recoil_drift_vertical: 6

stratagems:

  E/MG-101 HMG Emplacement:
    notes: |
      Balanced around magnum caliber, full-auto at 1200 RPM.
      Larger ammo pool and a tougher hull than stock.
    projectile.drag: 0.1                                  # stock 0.3
    projectile.velocity: 980
    damage.standard_damage: 220                           # stock 200
    damage.durable_damage: 100                            # stock 40
    damage.stagger: 30                                    # stock 25
    damage.demolition: 15                                 # stock 20
    damage.ap_large: 3                                    # stock 4
    weapon.fire_rate: 1200                                # stock 600
    weapon.capacity: 1000                                 # stock 300
    entity.health: 2000                                   # stock 1000
