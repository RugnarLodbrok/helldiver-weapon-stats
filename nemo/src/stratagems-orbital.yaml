description: Tunes the orbital stratagems' cooldowns and payload damage.

stratagems:

  Orbital Gas Strike:
    notes: Low cooldown, reliable crowd control.
    stratagem.cooldown: 35                                # stock 75

  Orbital EMS Strike:
    notes: Low cooldown, reliable crowd control.
    stratagem.cooldown: 35                                # stock 75

  Orbital Smoke Strike:
    notes: Low cooldown, protection.
    stratagem.cooldown: 35                                # stock 75
    explosion.outer_radius: 20

  Orbital Precision Strike:
    notes: Reliable blow this shit button.
    stratagem.cooldown: 53                                # stock 80
    explosion.damage.standard_damage: 3000
    explosion.damage.durable_damage: 3000

  Orbital Airburst Strike:
    notes: Reliable area denial.
    stratagem.cooldown: 70                                # stock 100

  Orbital Gatling Barrage:
    notes: Reliable area denial.
    stratagem.cooldown: 70                                # stock 70

  Orbital Railcannon Strike:
    notes: Deletes and overpenetrates any target.
    stratagem.cooldown: 90                                # stock 180
    damage.durable_damage: 14000
    damage.standard_damage: 14000
    damage.ap_direct: 18
    damage.ap_slight: 18
    damage.ap_large: 18
    damage.ap_extreme: 18
    explosion.inner_radius: 3.0
    explosion.outer_radius: 10.0
    explosion.shockwave_radius: 20.0
    explosion.damage.stagger: 50

  Orbital Laser:
    notes: No usage limit.
    stratagem.max_uses: -1                                # stock 3

  Orbital 380mm HE Barrage:
    notes: More reliable area cleanup.
    orbital.salvos: 5
    orbital.shells_per_salvo: 5
    orbital.shell_interval: 1.1
    orbital.salvo_interval: 2.0

  Orbital Napalm Barrage:
    notes: Nerfed, but still deletes breach.
    orbital.salvos: 3
